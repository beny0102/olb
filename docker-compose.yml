name: olb

# `basic` boots the stack. `demo` adds a one-shot seed service that appends a
# reproducible nine-inning game. `vision`, `sim` and `monitoring` are reserved
# names — see docs/adr/0005-deployment-profiles.md.
services:
  db:
    image: postgres:16-alpine
    profiles: ["basic", "demo"]
    environment:
      POSTGRES_USER: olb
      POSTGRES_PASSWORD: olb
      POSTGRES_DB: olb
    volumes:
      - olb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olb -d olb"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: olb-api/Dockerfile
    profiles: ["basic", "demo"]
    environment:
      DATABASE_URL: postgres://olb:olb@db:5432/olb
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: olb-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    profiles: ["basic", "demo"]
    environment:
      # Server components reach the API over the compose network.
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  seed:
    build:
      context: ..
      dockerfile: olb-api/Dockerfile
    profiles: ["demo"]
    # The API image keeps its build output under dist/; run from there so the
    # command is the same path the package script uses.
    working_dir: /app/olb-api/dist
    command: ["node", "scripts/seed-demo.js"]
    environment:
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  olb-pgdata:
